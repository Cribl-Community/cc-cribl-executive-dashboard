# Product API access declaration. Declare Cribl product API paths your app needs to access.
# At install time, admins see exactly which platform resources the app will use.
#
# Every path below is read-only (GET), except the Cribl Search job endpoints, which
# create and read an asynchronous search job (a read of the `cribl_metrics` dataset —
# the job mutates no Cribl configuration). The dashboard never writes Cribl
# configuration; its only writes go to the app-scoped KV store, which is granted
# automatically.

policies:
  # Worker Group / Fleet inventory — drives the worker group filter and the
  # per-group fan-out for all group-scoped calls below.
  - object: '/master/groups'
    actions: ['GET']
  - object: '/products/stream/groups'
    actions: ['GET']
  - object: '/products/stream/groups/*'
    actions: ['GET']

  # Worker Node inventory — "% of healthy systems" and node last-connection time.
  - object: '/products/stream/workers'
    actions: ['GET']
  - object: '/master/workers'
    actions: ['GET']

  # Source / Destination health, aggregated across Worker Processes.
  - object: '/m/:gid/system/status/inputs'
    actions: ['GET']
  - object: '/m/:gid/system/status/outputs'
    actions: ['GET']

  # Source / Destination configuration — names, types, and disabled state.
  - object: '/m/:gid/system/inputs'
    actions: ['GET']
  - object: '/m/:gid/system/outputs'
    actions: ['GET']

  # Volume metrics via Cribl Search: ingress/egress time series and 7-day baselines
  # read from the `cribl_metrics` dataset. Search endpoints are addressed under the
  # `default_search` group id; the job is created (POST), then polled and paged (GET),
  # and cancelled on teardown (POST /cancel), so both verbs are needed on the subpath.
  - object: '/m/:gid/search/jobs'
    actions: ['POST']
  - object: '/m/:gid/search/jobs/*'
    actions: ['GET', 'POST']

  # Deployment context and license entitlement, used to prefill the credit model.
  - object: '/system/info'
    actions: ['GET']
  - object: '/system/licenses/usage'
    actions: ['GET']
